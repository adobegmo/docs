# Fastly Compute package manifest. Used for LOCAL development only
# (`aio aem edge-functions serve`); deployed config comes from config/*.yaml and
# Cloud Manager. See https://www.fastly.com/documentation/reference/compute/fastly-toml
authors = []
description = "Docket auth edge function"
language = "javascript"
manifest_version = 3
name = "docket-auth-edge-worker"
service_id = ""

[scripts]
  post_init = "npm install"

[local_server]
  # Outbound hosts the function calls. In the deployed environment these resolve
  # as dynamic backends; locally they must be declared here (matched by URL).
  [local_server.backends]
    [local_server.backends.ims]
      url = "https://ims-na1.adobelogin.com"
    [local_server.backends.ims-stg]
      url = "https://ims-na1-stg1.adobelogin.com"
    [local_server.backends.da-admin]
      url = "https://admin.da.live"
    [local_server.backends.aem-origin]
      # Point at your own main--<site>--<org>.aem.live for local proxy testing.
      url = "https://main--site--org.aem.live"

  # Non-sensitive config, mirrors config/edgeFunctions.yaml `configs` for local dev.
  # SITES maps the local host to a site so the resolver + proxy work locally.
  [local_server.config_stores]
    [local_server.config_stores.config_default]
      format = "inline-toml"
    [local_server.config_stores.config_default.contents]
      SITES = "{ \"127.0.0.1:7676\": { \"org\": \"adobegmo\", \"site\": \"red\" } }"
      AEM_HOST_SUFFIX = "aem.page"
      IMS_ENV = "prod"
      IMS_CLIENT_ID_PUBLIC = "local-public-client"
      IMS_CLIENT_ID = "local-service-client"
      IMS_SCOPE = "AdobeID,openid"

  # Local secrets, mirrors config/edgeFunctions.yaml `secrets`. Dev-only values.
  [local_server.secret_stores]
    [[local_server.secret_stores.secret_default]]
      key = "SESSION_SECRET"
      data = "local-dev-session-secret-change-me"
    [[local_server.secret_stores.secret_default]]
      key = "IMS_CLIENT_SECRET"
      data = "local-dev-ims-client-secret"
