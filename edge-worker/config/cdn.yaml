kind: "CDN"
version: "1"
data:
  # TEMPORARY DIAGNOSTIC — does NOT reference the edge function.
  # If the config pipeline's CDN step goes GREEN with this, then the failure is
  # specifically the `selectAemOrigin: edgefunction-docket-auth` binding (i.e. the
  # edge-function compute isn't provisioned), not our config or the domain.
  # Revert to the real gate-red-preview rule after testing.
  requestTransformations:
    rules:
      - name: cdn-debug-noop
        when: { reqProperty: path, equals: "/__cdn_debug_noop" }
        actions:
          - type: set
            reqHeader: x-cdn-debug
            value: "ok"
