kind: "EdgeFunctions"
version: "1"
data:
  functions:
    - name: docket-auth

  # Non-sensitive configuration. Committed to Git and exposed to the function via
  # the "config_default" config store (read with ConfigStore in src/lib/env.js).
  # Fill in the deployment-specific values before running the config pipeline.
  configs:
    # Multi-site (repoless): map each gated public host to its da.live org/site.
    # The host also acts as the CSRF origin allowlist. Add an entry per site.
    # hostSuffix is optional per entry; defaults to AEM_HOST_SUFFIX below.
    #
    # WORKAROUND (SKYOPS-157895): the Adobe CDN config generator crashes on a raw
    # JSON-object config value, so SITES must be base64-encoded here and is decoded
    # in src/lib/sites.js (parseSites). Regenerate after changing sites with:
    #   node -e 'console.log(Buffer.from(JSON.stringify(MAP)).toString("base64"))'
    # Decoded value below is:
    #   { "test.red.adobe.com":     { "org": "adobegmo", "site": "red" },
    #     "test.writing.adobe.com": { "org": "adobegmo", "site": "writing" } }
    # Revert to raw JSON once SKYOPS-157895 ships (the parser accepts either).
    - key: SITES
      value: "eyJ0ZXN0LnJlZC5hZG9iZS5jb20iOnsib3JnIjoiYWRvYmVnbW8iLCJzaXRlIjoicmVkIn0sInRlc3Qud3JpdGluZy5hZG9iZS5jb20iOnsib3JnIjoiYWRvYmVnbW8iLCJzaXRlIjoid3JpdGluZyJ9fQ=="
    - key: AEM_HOST_SUFFIX
      value: "aem.page"           # default AEM tier: aem.live (published) or aem.page (preview)
    - key: IMS_ENV
      value: "prod"               # prod | stage | dev (selects the IMS host + imslib env)
    - key: IMS_CLIENT_ID_PUBLIC
      value: "adobegmo"   # browser sign-in + IMS profile call
    - key: IMS_CLIENT_ID
      value: "1ff3f2543d454d1e97e500d7dfd9ba94"        # confidential client_credentials identity (DA read)
    - key: IMS_SCOPE
      value: "openid, AdobeID, additional_info.projectedProductContext, aem.frontend.all, read_organizations"           # scopes for the client_credentials token

  # Sensitive values. The real value lives as a Cloud Manager secret; the
  # ${{...}} reference points at it. Never put secret values in `configs`.
  secrets:
    # WORKAROUND: a second ${{...}} secret variable resolves EMPTY in the Adobe CDN
    # config generator (confirmed: DOCKET_IMS_CLIENT_SECRET, set non-empty, arrives
    # empty in the secret bundle regardless of order, while DOCKET_SESSION_SECRET
    # resolves fine). So every real secret is packed into the ONE working variable
    # as a base64 JSON bundle and split in src/lib/env.js. Build + set with:
    #   node -e 'console.log(Buffer.from(JSON.stringify({SESSION_SECRET:"<hex>",IMS_CLIENT_SECRET:"<ims-secret>",ORIGIN_AUTHENTICATION:"<hlx_site-token>"})).toString("base64"))'
    #   aio cloudmanager:set-pipeline-variables <pipelineId> --programId <programId> --secret DOCKET_SESSION_SECRET "<base64>"
    # SESSION_SECRET + IMS_CLIENT_SECRET are shared across sites; ORIGIN_AUTHENTICATION
    # is the site's OWN aem.page/aem.live token (token-based Site Authentication), so
    # each program's bundle carries a DIFFERENT ORIGIN_AUTHENTICATION. It is optional:
    # omit it until the site's origin is locked. Per program, e.g.:
    #   red     -> --programId 223257 (pipeline 58562245)
    #   writing -> --programId 223466 (its own pipeline id)
    # Revert to separate secret variables once the pipeline bug is fixed.
    - key: APP_SECRETS
      value: ${{DOCKET_SESSION_SECRET}}
